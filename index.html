<header>
<h1>📘 中1 漢字・読みトレーニング</h1>
<p>漢字を書く・読みを答える・意味を確認する！</p>
</header>

<main>
<section id="startScreen" class="card">
<h2>練習を始めよう！</h2>
<p>「漢字を身につけよう2・3」と「漢字のしくみ2」を、すべてまとめて練習できます。</p>
<div class="row">
<label>問題数　
<select id="count">
<option value="10">10問</option>
<option value="20">20問</option>
<option value="50">50問</option>
<option value="0">全部</option>
</select>
</label>
</div>
<p><b>出題方法</b></p>
<div class="row">
<label class="choice"><input type="checkbox" id="writingMode" checked> ✍️ 漢字を書く</label>
<label class="choice"><input type="checkbox" id="readingMode" checked> 🔊 読みを答える</label>
</div>
<div class="row" style="margin-top:20px">
<button id="startButton" class="primary">練習スタート！</button>
<button id="studyButton" class="secondary">📖 全問題を一覧で復習</button>
</div>
<p class="small">※ 出題される部分は「　」と黄色で囲んで表示されます。答え合わせでは、正解・不正解にかかわらず意味を必ず確認します。</p>
</section>

<section id="quizScreen" class="card hidden">
<div id="topline">
<span id="progressText"></span>
<span id="questionType"></span>
<span>正解：<b id="scoreNow">0</b></span>
</div>
<div id="barOuter"><div id="bar"></div></div>
<div id="sentence"></div>
<div id="hint"></div>
<div class="answerRow">
<input id="answerInput" type="text" autocomplete="off">
<button id="checkButton" class="primary">答える</button>
</div>
<div id="feedback" class="hidden"></div>
<div id="afterButtons" class="row hidden" style="margin-top:15px">
<button id="nextButton" class="primary">次の問題へ →</button>
<button id="retryButton" class="secondary">もう一度入力</button>
</div>
<p class="small">Enterキー：答え合わせ → 意味を確認 → 次の問題へ</p>
</section>

<section id="resultScreen" class="card hidden" style="text-align:center">
<h2>🎉 おつかれさま！</h2>
<div id="finalScore" style="font-size:52px;font-weight:bold;color:#2563eb"></div>
<p id="finalMessage"></p>
<div class="row" style="justify-content:center">
<button id="wrongReviewButton" class="primary">📚 間違えた問題を復習</button>
<button id="wrongButton" class="secondary">🔄 間違えた問題に再挑戦</button>
<button id="restartButton" class="secondary">最初に戻る</button>
</div>
</section>

<section id="wrongReviewScreen" class="card hidden">
<h2>📚 間違えた問題を復習</h2>
<p class="small">答えと意味を確認してから、もう一度挑戦しよう。</p>
<div id="wrongReviewList"></div>
<div class="row" style="margin-top:16px">
<button id="wrongReviewRetryButton" class="primary">🔄 この問題に再挑戦</button>
<button id="closeWrongReviewButton" class="secondary">結果に戻る</button>
</div>
</section>

<section id="studyScreen" class="card hidden">
<h2>📖 漢字・読み・意味一覧</h2>
<p class="small">テスト前の総復習にも使えます。</p>
<div id="studyList"></div>
<button id="closeStudyButton" class="secondary" style="margin-top:16px">戻る</button>
</section>
</main>

  const x=a.slice();
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function norm(s){return String(s).replace(/[\s　]/g,"").normalize("NFKC").toLowerCase();}
function hira(s){return String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}

function buildQuestions(){
  const types=[];
  if($("writingMode").checked) types.push("writing");
  if($("readingMode").checked) types.push("reading");
  if(!types.length){alert("「漢字を書く」か「読みを答える」を選んでください。");return null;}
  const list=[];
  DATA.forEach(q=>types.forEach(type=>list.push({...q,type})));
  return list;
}

function makeMarked(q){
  const pos=q.sentence.indexOf(q.target);
  const displayTarget = (q.type==="writing" ? q.target : q.answer);

  // 送り仮名がある問題は、出題箇所に（　）で明示する。
  // 例：「たがいに助け合う。」→「互（い）に助け合う。」
  const okuriganaMap = {
    "互": "（い）"
  };
  const markedTarget = okuriganaMap[displayTarget]
    ? displayTarget + okuriganaMap[displayTarget]
    : displayTarget;

  if(pos<0) return {before:q.sentence+"　", target:markedTarget, after:""};
  return {
    before:q.sentence.slice(0,pos),
    target:markedTarget,
    after:q.sentence.slice(pos+q.target.length)
  };
}

function startQuiz(custom){
  const base=custom||buildQuestions();
  if(!base) return;
  state.questions=shuffle(base);
  const n=Number($("count").value);
  if(n>0) state.questions=state.questions.slice(0,Math.min(n,state.questions.length));
  state.index=0; state.correct=0; state.wrong=[]; state.checked=false;
  $("startScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  $("wrongReviewScreen").classList.add("hidden");
  $("studyScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  render();
}

function render(){
  const q=state.questions[state.index];
  state.checked=false;
  $("progressText").textContent=(state.index+1)+" / "+state.questions.length;
  $("scoreNow").textContent=state.correct;
  $("bar").style.width=(state.index/state.questions.length*100)+"%";
  $("questionType").textContent=q.type==="writing"?"✍️ 漢字を書く":"🔊 読みを答える";

  const m=makeMarked(q), box=$("sentence");
  box.innerHTML="";
  box.append(document.createTextNode(m.before));
  const span=document.createElement("span");
  span.className="target";
  span.textContent="「"+m.target+"」";
  box.append(span);
  box.append(document.createTextNode(m.after));

  $("hint").textContent=q.type==="writing"
    ?"「　」で囲まれた部分を漢字で答えよう。"
    :"「　」で囲まれた漢字の読みを、ひらがなで答えよう。";
  $("answerInput").placeholder=q.type==="writing"?"漢字で入力":"読みをひらがなで入力";
  $("answerInput").value="";
  $("answerInput").disabled=false;
  $("checkButton").disabled=false;
  $("feedback").className="hidden";
  $("feedback").innerHTML="";
  $("afterButtons").classList.add("hidden");
  $("answerInput").focus();
}

function check(){
  if(state.checked) return;
  const q=state.questions[state.index];
  const v=norm($("answerInput").value);
  if(!v){$("answerInput").focus();return;}

  state.checked=true;
  let ok=false;
  if(q.type==="writing"){
    const accepted=[q.answer,...(q.aliases||[])].map(norm);
    ok=accepted.includes(v);
  }else{
    ok=hira(v)===hira(norm(q.reading));
  }

  if(ok) state.correct++;
  else state.wrong.push(q);

  $("scoreNow").textContent=state.correct;
  $("answerInput").disabled=true;
  $("checkButton").disabled=true;

  const f=$("feedback");
  f.className=ok?"ok":"ng";
  const ans=q.type==="writing"
    ?q.answer+"（"+q.reading+"）"
    :q.reading+"（"+q.answer+"）";
  f.innerHTML=(ok?"⭕ <b>正解！</b>":"❌ <b>不正解。</b>")+
    "<div class='answer'>正解："+ans+"</div>"+
    "<div class='meaning'><b>意味：</b>"+q.meaning+"</div>";

  $("afterButtons").classList.remove("hidden");
  $("bar").style.width=((state.index+1)/state.questions.length*100)+"%";
}

function next(){
  state.index++;
  if(state.index<state.questions.length) render();
  else finish();
}
function retry(){
  state.checked=false;
  $("answerInput").disabled=false;
  $("checkButton").disabled=false;
  $("answerInput").value="";
  $("feedback").className="hidden";
  $("feedback").innerHTML="";
  $("afterButtons").classList.add("hidden");
  $("answerInput").focus();
}
function finish(){
  $("quizScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("finalScore").textContent=state.correct+" / "+state.questions.length;
  const r=Math.round(state.correct/state.questions.length*100);
  $("finalMessage").textContent=r===100?"全問正解！ 漢字も読みも完璧です！🏆":r>=80?"かなり仕上がっています！ 間違えた問題をもう一度！":"間違えた問題を復習して、次は自己ベストを目指そう！";
  const show=state.wrong.length?"inline-block":"none";
  $("wrongButton").style.display=show;
  $("wrongReviewButton").style.display=show;
}
function showStudy(){
  $("startScreen").classList.add("hidden");
  $("studyScreen").classList.remove("hidden");
  const list=$("studyList"); list.innerHTML="";
  DATA.forEach((q,i)=>{
    const d=document.createElement("div");
    d.className="studyItem";
    d.innerHTML="<div class='small'>"+(i+1)+"</div>"+
      "<div><span class='word'>"+q.answer+"</span><span class='reading'>（"+q.reading+"）</span></div>"+
      "<div>"+q.sentence+"</div>"+
      "<div class='meaning'><b>意味：</b>"+q.meaning+"</div>";
    list.append(d);
  });
}
function showWrongReview(){
  $("resultScreen").classList.add("hidden");
  $("wrongReviewScreen").classList.remove("hidden");
  const list=$("wrongReviewList"); list.innerHTML="";
  state.wrong.forEach((q,i)=>{
    const d=document.createElement("div");
    d.className="studyItem";
    const label=q.type==="writing"?"漢字を書く問題":"読みを答える問題";
    d.innerHTML="<div class='badge'>"+(i+1)+"．"+label+"</div>"+
      "<div><span class='word'>"+q.answer+"</span><span class='reading'>（"+q.reading+"）</span></div>"+
      "<div>"+q.sentence+"</div>"+
      "<div class='meaning'><b>意味：</b>"+q.meaning+"</div>";
    list.append(d);
  });
}

$("startButton").addEventListener("click",()=>startQuiz(null));
$("checkButton").addEventListener("click",check);
$("nextButton").addEventListener("click",next);
$("retryButton").addEventListener("click",retry);
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if($("quizScreen").classList.contains("hidden")) return;
  if(e.target===$("answerInput")||state.checked){
    e.preventDefault();
    state.checked?next():check();
  }
});
$("wrongButton").addEventListener("click",()=>startQuiz(state.wrong));
$("wrongReviewButton").addEventListener("click",showWrongReview);
$("wrongReviewRetryButton").addEventListener("click",()=>startQuiz(state.wrong));
$("closeWrongReviewButton").addEventListener("click",()=>{
  $("wrongReviewScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
});
$("restartButton").addEventListener("click",()=>{
  $("resultScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
});
$("studyButton").addEventListener("click",showStudy);
$("closeStudyButton").addEventListener("click",()=>{
  $("studyScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
});
</script>
</body>
</html>
